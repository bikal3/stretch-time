name: stretch_time
description: "StretchTime - interval timer for stretching and workouts."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.2
  web: ^1.1.2
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/beep.wav
    - assets/gong.wav
    - assets/silence.wav
    - assets/postures/
