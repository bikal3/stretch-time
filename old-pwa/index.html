<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>StretchTime</title>
<meta name="description" content="Simple interval timer for stretching and workouts.">
<meta name="theme-color" content="#f5435a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StretchTime">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --panel: #252525;
    --work: #5ee39a; --work-bg: #2c4136;
    --rest: #f43f5e; --rest-bg: #45252d;
    --ex: #d4d4d4;   --ex-bg: #3a3a3a;
    --rounds: #6d7cf5; --rounds-bg: #2b2d42;
    --reset: #f5d061; --reset-bg: #413a2b;
    --ready: #9aa4b2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* gradient lives on body so it shows through the play-button notch */
    background: linear-gradient(160deg, #ff6a55 0%, #f5435a 50%, #ec1c5c 100%) top / 100% 70vh no-repeat, var(--panel);
    color: #fff; display: flex; flex-direction: column; min-height: 100dvh;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Setup screen ---------- */
  header {
    padding: calc(env(safe-area-inset-top) + 20px) 20px 90px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.6rem; font-weight: 600; color: #6b1420; }
  #total { font-size: clamp(5rem, 24vw, 9rem); font-weight: 700; color: #000; margin: 6vh 0 0; letter-spacing: -2px; }
  main {
    position: relative; flex: 1; background: var(--panel);
    margin-top: -40px; border-radius: 28px 28px 0 0;
    padding: 70px 16px calc(env(safe-area-inset-bottom) + 24px);
    /* notch the play button sits in */
    -webkit-mask: radial-gradient(circle 64px at 50% 0, transparent 63px, #000 64px);
            mask: radial-gradient(circle 64px at 50% 0, transparent 63px, #000 64px);
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  /* play button lives outside <main> so the mask doesn't clip it */
  .hub { position: relative; height: 0; z-index: 2; }
  #play {
    position: absolute; left: 50%; top: -40px; transform: translate(-50%, -50%);
    width: 104px; height: 104px; border-radius: 50%; background: #000;
    box-shadow: 0 0 0 6px #f0285a, 0 8px 24px rgba(0,0,0,.4);
    display: grid; place-items: center;
  }
  #play:active { transform: translate(-50%, -50%) scale(.95); }
  #play svg { width: 44px; margin-left: 6px; fill: #f5435a; }
  .row {
    width: 100%; display: flex; align-items: center; gap: 18px;
    padding: 0 24px; height: 76px; margin-bottom: 12px; border-radius: 14px;
    font-size: 1.35rem; font-weight: 500; text-align: left;
  }
  .row svg { width: 30px; height: 30px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .row .label { flex: 1; color: #eee; }
  .row .val { font-size: 1.9rem; font-weight: 500; }
  .row:active { filter: brightness(1.2); }
  .row.load { height: 58px; background: #3d3d3d; color: #bbb; font-size: 1.2rem; }
  .row.load .label { color: #e5e5e5; }
  .work { background: var(--work-bg); color: var(--work); }
  .rest { background: var(--rest-bg); color: var(--rest); }
  .ex { background: var(--ex-bg); color: var(--ex); }
  .rounds { background: var(--rounds-bg); color: var(--rounds); }
  .reset { background: var(--reset-bg); color: var(--reset); }

  /* ---------- Dialogs ---------- */
  dialog {
    border: 0; border-radius: 20px; padding: 24px; width: min(92vw, 380px);
    background: #2e2e2e; color: #fff;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 18px; font-size: 1.3rem; text-align: center; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .stepper button { width: 56px; height: 56px; border-radius: 50%; background: #444; font-size: 1.8rem; }
  .stepper input {
    width: 72px; font: inherit; font-size: 2.2rem; text-align: center; color: #fff;
    background: #1f1f1f; border: 1px solid #555; border-radius: 10px; padding: 6px 0;
  }
  .stepper .colon { font-size: 2rem; }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .actions button { flex: 1; padding: 14px; border-radius: 12px; background: #444; font-weight: 600; }
  .actions .primary { background: #f5435a; }
  #history { list-style: none; padding: 0; margin: 0; max-height: 55vh; overflow: auto; }
  #history button { width: 100%; text-align: left; padding: 14px; border-radius: 12px; background: #3a3a3a; margin-bottom: 8px; }
  #history small { display: block; color: #aaa; margin-top: 4px; }
  .empty { color: #aaa; text-align: center; }

  /* ---------- Run screen ---------- */
  #run {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 30px);
    background: #111; z-index: 10; text-align: center;
  }
  #run.on { display: flex; }
  #run[data-type=ready] { background: #2a2f38; }
  #run[data-type=work]  { background: #1e7a4c; }
  #run[data-type=rest]  { background: #b3213f; }
  #run[data-type=reset] { background: #a8861f; }
  #run[data-type=done]  { background: linear-gradient(160deg, #ff6a55, #ec1c5c); }
  #phase { font-size: 2.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }
  #clock { font-size: clamp(6rem, 32vw, 14rem); font-weight: 700; line-height: 1; margin: 16px 0; }
  #meta { font-size: 1.2rem; opacity: .85; }
  #remain { margin-top: 6px; opacity: .7; }
  .bar { width: min(90%, 520px); height: 8px; background: rgba(0,0,0,.25); border-radius: 4px; margin-top: 28px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #fff; }
  .controls { display: flex; gap: 28px; margin-top: 44px; align-items: center; }
  .controls button { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.25); display: grid; place-items: center; }
  .controls #pause { width: 88px; height: 88px; background: rgba(0,0,0,.4); }
  .controls svg { width: 30px; fill: #fff; }
</style>
</head>
<body>
  <header>
    <h1>StretchTime</h1>
    <div id="total" class="num">00:00</div>
  </header>

  <div class="hub"><button id="play" aria-label="Start workout">
    <svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z"/></svg>
  </button></div>

  <main>
    <div class="wrap">

      <button class="row load" id="load">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="label">Load Previous Workout</span>
        <svg viewBox="0 0 24 24" style="width:22px"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg>
      </button>

      <button class="row work" data-key="work">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>
        <span class="label">Work</span><span class="val num"></span>
      </button>
      <button class="row rest" data-key="rest">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8v8M14 8v8"/></svg>
        <span class="label">Rest</span><span class="val num"></span>
      </button>
      <button class="row ex" data-key="exercises">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M13 6l-4 7h4l-2 5 5-7h-4z" fill="currentColor"/></svg>
        <span class="label">Exercises</span><span class="val num"></span>
      </button>
      <button class="row rounds" data-key="rounds">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
        <span class="label">Rounds</span><span class="val num"></span>
      </button>
      <button class="row reset" data-key="reset">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/></svg>
        <span class="label">Round Reset</span><span class="val num"></span>
      </button>
    </div>
  </main>

  <dialog id="edit">
    <form method="dialog">
      <h2 id="editTitle"></h2>
      <div class="stepper">
        <button type="button" data-step="-1" aria-label="Decrease">−</button>
        <input id="mm" type="number" inputmode="numeric" min="0" aria-label="Minutes">
        <span class="colon" id="colon">:</span>
        <input id="ss" type="number" inputmode="numeric" min="0" max="59" aria-label="Seconds">
        <button type="button" data-step="1" aria-label="Increase">+</button>
      </div>
      <div class="actions">
        <button value="cancel">Cancel</button>
        <button value="ok" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="historyDlg">
    <form method="dialog">
      <h2>Previous Workouts</h2>
      <ul id="history"></ul>
      <div class="actions"><button value="cancel">Close</button></div>
    </form>
  </dialog>

  <section id="run" aria-live="polite">
    <div id="phase"></div>
    <div id="clock" class="num"></div>
    <div id="meta"></div>
    <div id="remain" class="num"></div>
    <div class="bar"><div id="progress"></div></div>
    <div class="controls">
      <button id="stop" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
      <button id="pause" aria-label="Pause"></button>
      <button id="skip" aria-label="Skip"><svg viewBox="0 0 24 24"><path d="M4 5l9 7-9 7zM13 5l9 7-9 7z"/></svg></button>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
